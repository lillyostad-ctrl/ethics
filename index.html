<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اتاق تصمیم اخلاق بالینی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* layout: board pack. top meters strip, right rail with radar and axes, main column with the decision brief */
:root{
  --bg:#f7f8fb; --panel:#ffffff; --ink:#1a2032; --muted:#7c849b; --line:#eceef4;
  --accent:#1f5eff; --accent-soft:#eaf1ff; color-scheme:light; --good:#17a370; --warn:#e8a13a; --bad:#e5484d;
  --f-body:"Vazirmatn","Tahoma",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.8;font-size:15px}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0 0 8px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;padding:8px 0 14px;border-bottom:2px solid var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink);padding:6px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
button:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.meter .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meter b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;transition:width .4s}
.grid{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}.meters{gap:6px}.meter{padding:8px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.rail{display:flex;flex-direction:column;gap:14px}
.axes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.axes button{width:100%;text-align:right;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 10px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.axes button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.axes small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 14px;border-radius:6px;font:inherit;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.chip{display:inline-block;font-size:12px;padding:1px 9px;border-radius:10px;background:var(--accent-soft);color:var(--accent);margin-inline-end:6px}
.brief{font-size:16px;margin:10px 0 14px}
.opt{display:block;width:100%;text-align:right;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.picked{border-color:var(--accent);border-width:2px}
.opt.best{background:color-mix(in srgb,var(--good) 10%,var(--panel))}
.delta{display:flex;gap:10px;font-size:12px;margin-top:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.delta span{padding:0 8px;border-radius:4px;background:var(--bg)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.ref,.evt{border-inline-start:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:4px;margin:12px 0}
.evt{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--panel))}
.src{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--panel);padding:7px 16px;border-radius:6px;font:inherit;cursor:pointer}
.erow{display:flex;align-items:center;gap:12px;margin:10px 0}.erow span{width:170px;font-size:14px}.erow .bar{flex:1;margin-top:0}.erow b{width:46px;text-align:start;font-size:13px}
.btn.ghost{background:none;color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}

.authwrap{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,#e9eefb 0,#f7f8fb 60%)}
.authcard{width:100%;max-width:400px;background:#fff;border:1px solid rgba(236,238,244,.9);border-radius:22px;padding:26px;color:var(--ink);box-shadow:0 2px 4px rgba(24,39,90,.05),0 20px 50px rgba(24,39,90,.12)}
.authcard h2{font-size:26px;margin:22px 0 18px;color:var(--ink)}
.pill{display:inline-flex;gap:4px;background:var(--accent-soft);border-radius:999px;padding:4px}
.pill button{border:0;background:none;color:var(--muted);padding:8px 22px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
.pill button[aria-selected="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(24,39,90,.15)}
.authcard form{display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.authcard input{width:100%;height:50px;background:#f7f8fb;border:1px solid var(--line);border-radius:14px;padding:0 14px;color:var(--ink);font:inherit}
.authcard input::placeholder{color:#9aa1b6}
.authcard input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;background:#fff}
.field{position:relative;display:block}
.field svg{position:absolute;inset-inline-start:14px;top:16px;color:#9aa1b6}
.field input{padding-inline-start:44px}
#authGo{height:50px;border:0;border-radius:14px;background:linear-gradient(180deg,#2f6bff,#1a54f0);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:6px;box-shadow:0 6px 16px rgba(31,94,255,.32)}
#authMsg{min-height:20px;margin:12px 0 0;font-size:13px;color:var(--bad)}
textarea{width:100%;min-height:64px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;resize:vertical}
.step{margin-bottom:12px}
.step label{font-weight:700;display:block}
.step .hint{font-size:12px;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}

/* ---- dashboard look: white cards, layered soft shadows, blue accent, solid tag pills ---- */
:root{--sh1:0 1px 2px rgba(24,39,90,.05),0 4px 14px rgba(24,39,90,.06);--sh2:0 2px 4px rgba(24,39,90,.05),0 10px 28px rgba(24,39,90,.09)}
body{background:linear-gradient(180deg,#e9eefb 0,#f7f8fb 340px) no-repeat,#f7f8fb;min-height:100vh}
header{border:0;padding:4px 0 14px;justify-content:flex-start}
.grid{grid-template-columns:272px 1fr;gap:18px}
.rail{gap:16px}
.side{background:var(--panel);border-radius:18px;box-shadow:var(--sh1);padding:18px 14px;border:1px solid rgba(236,238,244,.9)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:2px 6px 16px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2f6bff,#1646d8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 10px rgba(31,94,255,.35);flex:none}
.sh{font-weight:700;font-size:15px;padding:0 8px 8px}
.axes{gap:2px}
.axes button{border:0;background:transparent;border-radius:10px;padding:9px 8px;color:var(--ink);align-items:center}
.axes button:hover{background:var(--bg)}
.axes button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.axes .al{display:flex;align-items:center;gap:10px}
.ring{display:inline-block;width:14px;height:14px;border:2px solid;flex:none}
.ring.q{border-radius:4px}.ring.c{border-radius:50%}
.axes small{border:1px solid #dfe3ee;border-radius:999px;padding:0 9px;background:#fff;color:var(--accent);font-size:12px}
.meters{gap:14px;margin:0 0 18px}
.meter{background:var(--panel);border:1px solid rgba(236,238,244,.9);border-radius:16px;box-shadow:var(--sh1);padding:14px 16px}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:500}
.circ{width:30px;height:30px;border:1.5px solid;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
.bar{height:5px;border-radius:3px;background:#e6eaf3;margin-top:12px}
.crumb{font-size:13px;color:var(--muted)}.crumb span{margin:0 4px}
.ptitle{font-size:26px;font-weight:700;margin:6px 0 4px;line-height:1.5}
.utabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:10px 0 18px;overflow-x:auto}
.utabs button{border:0;background:none;color:var(--muted);font:inherit;padding:10px 2px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.utabs button[aria-current="true"]{color:var(--accent);border-color:var(--accent);font-weight:500}
.card{background:var(--panel);border-radius:18px;box-shadow:var(--sh1);padding:20px;border:1px solid rgba(236,238,244,.9)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;color:#fff;border-radius:999px;padding:1px 12px}
.tag.blue{background:#1f5eff}.tag.purple{background:#b57cf2}.tag.gray{background:#a9b4c8}
.brief{font-size:17px;line-height:2;margin:14px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px;border:1px solid var(--line);background:#fff;box-shadow:0 1px 2px rgba(24,39,90,.04);transition:box-shadow .15s,border-color .15s}
.opt:hover:not([disabled]){box-shadow:var(--sh2);border-color:#c9d6f7;background:#fff}
.opt .ltr{flex:none;min-width:34px;height:26px;padding:0 8px;border-radius:999px;background:#a9b4c8;color:#fff;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center}
.opt .otxt{flex:1}
.opt.picked{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,94,255,.12)}
.opt.picked .ltr{background:var(--accent)}
.opt.best{border-color:var(--good);background:#f3fbf7}
.opt.best .ltr{background:var(--good)}
.delta span{border-radius:999px;padding:0 10px;background:#f1f3f9}
.ref,.evt{border:0;border-radius:14px;padding:14px 16px}
.ref{background:linear-gradient(135deg,#eef3ff,#f6f0ff)}
.evt{background:#fff6e8}
.btn{border-radius:10px;padding:9px 20px;background:linear-gradient(180deg,#2f6bff,#1a54f0);border:0;color:#fff;font-weight:500;box-shadow:0 4px 12px rgba(31,94,255,.3)}
.btn.ghost{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.seg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--sh1)}
.seg button{border-radius:9px;color:var(--muted);padding:6px 16px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
@media(max-width:820px){.grid{grid-template-columns:1fr}.ptitle{font-size:22px}}
</style>
</head>
<body>
<div id="auth" hidden class="authwrap">
 <div class="authcard">
  <div class="pill" role="tablist"><button id="modeUp" type="button" aria-selected="true">ثبت‌نام</button><button id="modeIn" type="button" aria-selected="false">ورود</button></div>

  <form id="authForm">

   <label class="field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><input id="em" type="email" required placeholder="ایمیل" autocomplete="email" aria-label="ایمیل" dir="ltr"></label>

   <button id="authGo" type="submit">ساخت حساب</button>
  </form>
  <p id="authMsg" role="status"></p>
 </div></div>
<div class="wrap">
<header>
  <div>
    
  </div>

</header>

<div class="meters" id="meters"></div>

<div class="grid">

</div>

t": -1, "risk": 2}}], "expert_ref": "پرهیز از رابطه‌ی غیرحرفه‌ای و سوءاستفاده از رابطه‌ی حرفه‌ای (ص ۹۴)؛ پرهیز از رابطه‌ی جنسی؛ ازدواج با مراجع فقط پس از حداقل ۲ سال از پایان یا توقف مداخله (ص ۹۷). ثبت تصمیم (ص ۳۶).", "events": [], "source": "ص ۹۴، ۹۷، ۳۶"}, {"id": "SC03", "concept": "C7,C8", "track": "therapist", "spine": "S3", "brief": "مراجع در جلسه می‌گوید قصد دارد همسر سابقش را که نام او را می‌دانید «تنبیه» کند. بعد می‌گوید شوخی بوده. او رازداری را به‌شدت مهم می‌داند.", "options": [{"text": "خطر را ارزیابی می‌کنید و چون موضوع جدی است، بدون مشورت نام و جزئیات کامل پرونده را برای پلیس و خانواده‌ی مراجع می‌فرستید، چون سنجیدن بیشتر را وقت‌گیر و غیرضروری می‌دانید.", "consequence": {"welfare": 1, "trust": -2, "risk": 1}}, {"text": "با مراجع درباره‌ی جدی بودن حرفش صحبت می‌کنید، قول عدم اقدام می‌گیرید، جلسه‌ی بعد را زودتر می‌گذارید و موضوع را ثبت می‌کنید، و فکر می‌کنید مراجع از این تصمیم ناراضی نخواهد شد.", "consequence": {"welfare": 1, "trust": 1, "risk": 1}}, {"text": "خطر را ارزیابی می‌کنید، با ناظر مشورت می‌کنید، اگر خطر جدی ماند حداقل اطلاعات لازم را به مرجع مربوط می‌دهید و مراجع را مطلع می‌کنید.", "consequence": {"welfare": 3, "trust": -1, "risk": -2}}, {"text": "چون حرف مبهم و شوخی‌مانند بود، فقط آن را ثبت می‌کنید و در جلسات بعد دقیق‌تر پیگیری می‌کنید، مگر اینکه تهدید دوباره تکرار شود، چون در موارد مشابه قبلی هم همین روش را به کار برده‌اید.", "consequence": {"welfare": 1, "trust": 1, "risk": 2}}], "expert_ref": "نقض رازداری در خطر جانی برای دیگران مجاز است؛ افشا در حداقل ممکن و آگاه‌کردن مراجع تا حد ممکن (ص ۹۵). پرونده‌ی تاراسوف: وظیفه‌ی اقدام منطقی برای حفظ جان قربانی قابل‌پیش‌بینی (ص ۲۸–۲۹). مشورت در هر مرحله (ص ۳۳).", "events": [], "source": "ص ۹۵، ۲۸–۳۰، ۳۳"}, {"id": "SC04", "concept": "C10,C11", "track": "therapist", "spine": "S4", "brief": "والد یک نوجوان می‌خواهد نتایج آزمون فرزندش را ببیند. نوجوان از شما خواسته نتایج را به پدر ندهید چون می‌ترسد تنبیه شود. یک کارآموز هم پیشنهاد می‌کند خودش نمره‌گذاری را انجام دهد.", "options": [{"text": "نتایج را فقط به خ ": 0, "trust": 0, "risk": 2}}, {"text": "با ناظر یا همکار مورد اعتماد مشورت می‌کنید، توانتان را صادقانه ارزیابی می‌کنید و در صورت اختلال، جلسه را با ارجاع یا جایگزین هماهنگ می‌کنید.", "consequence": {"welfare": 2, "trust": 1, "risk": -2}}, {"text": "جلسه را برگزار می‌کنید و درباره‌ی تجربه‌ی شخصی خود با مراجع صحبت می‌کنید تا او احساس کند شما او را بهتر می‌فهمید.", "consequence": {"welfare": 0, "trust": 0, "risk": 2}}, {"text": "جلسه‌ی این مراجع را به تأخیر می‌اندازید و دلیل را فقط «کسالت» می‌گویید، بدون ارجاع یا پیگیری و بدون مشورت با کسی.", "consequence": {"welfare": 0, "trust": -1, "risk": 1}}], "expert_ref": "پرهیز از کار در موقعیتی که مشکلات شخصی در انجام وظایف اختلال ایجاد می‌کند (ص ۹۲)؛ مشورت در هر مرحله (ص ۳۳)؛ بهای تصمیم اخلاقی و فشار آن (ص ۳۵)؛ رها نکردن مراجع بدون تدابیر معقول (ص ۴۳).", "events": [], "source": "ص ۹۲، ۳۳، ۳۵، ۴۳"}, {"id": "SC14", "concept": "C5", "track": "therapist", "spine": "S2", "brief": "درمان موفق تمام شده. مراجع می‌خواهد علاوه بر تعرفه، مبلغ قابل‌توجهی «برای تشکر» به شما بدهد و می‌گوید اگر نپذیرید ناراحت می‌شود.", "options": [{"text": "می‌پذیرید و آن را به‌عنوان کمک به مرکز درمانی ثبت می‌کنید تا چیزی برای خودتان باقی نماند و مراجع هم ناراحت نشود.", "consequence": {"welfare": 0, "trust": 0, "risk": 2}}, {"text": "می‌پذیرید ولی بلافاصله مبلغ را به یک خیریه می‌دهید و به مراجع اطلاع می‌دهید که پول او صرف کار خیر شده است.", "consequence": {"welfare": 1, "trust": 0, "risk": 1}}, {"text": "می‌گویید «ممنون، لازم نیست» و نمی‌پذیرید، ولی دلیل را توضیح نمی‌دهید و موضوع را در پرونده ثبت نمی‌کنید.", "consequence": {"welfare": 1, "trust": 0, "risk": 0}}, {"text": "با سپاس توضیح می‌دهید که فقط طبق تعرفه دریافت می‌کنید، احساس مراجع را در پایان درمان بررسی می‌کنید و موضوع را در پرونده ثبت می‌کنید.", "consequence": {"welfare": 2, "trust": 1, "risk": -1}}], "expert_ref": "حق‌الزحمه طبق تعرفه و دریافت نکردن وجه دیگر (ص ۹۷)؛ اطلاع‌رسانی و توافق مالی از ابتدا (ص ۹۳)؛ پرهیز از سوءاستفاده از رابطه‌ی حرفه‌ای (ص ۹۴).", "events": [], "source": "ص ۹۷، ۹۳، ۹۴"}, are": 1, "trust": 2, "risk": -2}}, {"text": "به‌جای ضبط، همه‌ی جزئیات جلسه را همراه نام مراجع برای ناظر یادداشت می‌کنید تا نظارت بدون فایل صوتی انجام شود، با این باور که اگر لازم شد بعداً می‌توانید اوضاع را اصلاح کنید.", "consequence": {"welfare": 0, "trust": 0, "risk": 2}}], "expert_ref": "کسب مجوز کتبی پیش از ضبط صوتی یا تصویری (ص ۹۵)؛ احتیاط برای حفظ اطلاعات محرمانه و ثبت به‌گونه‌ای که سوءاستفاده ممکن نباشد (ص ۹۵)؛ پنهان‌سازی هویت در مشورت (ص ۳۳–۳۴).", "events": [], "source": "ص ۹۵، ۳۳–۳۴، ۹۷"}, {"id": "SC17", "concept": "C7", "track": "student", "spine": "S3", "brief": "کارورزید. مراجع بزرگسالی می‌گوید به HIV مبتلاست و همسرش خبر ندارد. می‌گوید «اگر به کسی بگویی دیگر نمی‌آیم».", "options": [{"text": "همسر مراجع را تلفنی مطلع می‌کنید چون خطر سلامت دارد و ممکن است بیماری به او منتقل شود، بدون مشورت با کسی.", "consequence": {"welfare": 0, "trust": -2, "risk": 2}}, {"text": "به مراجع قول می‌دهید هرگز چیزی نگویید تا درمان ادامه یابد و ناظر را هم در جریان نمی‌گذارید تا اعتمادش حفظ شود.", "consequence": {"welfare": 0, "trust": 1, "risk": 2}}, {"text": "فوراً به مراجع می‌گویید که باید خودش به همسرش بگوید و گرنه درمان را قطع می‌کنید و او را ارجاع می‌دهید.", "consequence": {"welfare": 0, "trust": -1, "risk": 1}}, {"text": "رازداری را حفظ می‌کنید، با ناظر مشورت می‌کنید، قانون و مرجع قانونی مربوط را بررسی می‌کنید و با مراجع روی گفتن به همسر کار می‌کنید.", "consequence": {"welfare": 2, "trust": 1, "risk": -2}}], "expert_ref": "نقض رازداری فقط با رضایت، خطر جانی، یا بیماری مسری کشنده مانند HIV در صورتی که قانون یا مرجع قانونی حکم کرده باشد؛ حداقل افشا و آگاه‌کردن مراجع (ص ۹۵)؛ مشورت با ناظر برای فرد تحت نظارت الزامی (ص ۳۴).", "events": [], "source": "ص ۹۵، ۳۴، ۹۳"}, {"id": "SC18", "concept": "C10,C11", "track": "therapist", "spine": "S4", "brief": "کلینیک می‌خواهد گزارش سریع هوش و شخصیت یک نوجوان مهاجر با زبان مادری متفاوت را همان روز بدهید. آزمون‌های موجود برای او هنجار ندارند و اجرای کامل دو جلسه طول می‌کشد.", "options": [{"text": "آزمون کوتاه‌شده را همان روز اجرا می‌کنید و consequence": {"welfare": 1, "trust": 0, "risk": 1}}], "expert_ref": "روش بدون پشتوانه‌ی پژوهشی کافی: قبلاً مراجع را در جریان بگذارید و موافقتش را جلب کنید (ص ۹۷)؛ فقط روش‌هایی که آموزش و تجربه دارید (ص ۹۱)؛ رضایت آگاهانه پیش از مداخله (ص ۹۷).", "events": [], "source": "ص ۹۷، ۹۱، ۳۳"}, {"id": "SC20", "concept": "C13", "track": "therapist", "spine": "S5", "brief": "در گروهی هشت‌نفره می‌خواهید تمرین فیزیکی تخلیه‌ای (هل دادن و گرفتن) را که در یک کارگاه دیده‌اید اجرا کنید. دو نفر از اعضا سابقه‌ی آسیب جسمی دارند.", "options": [{"text": "تمرین را اجرا می‌کنید و می‌گویید شرکت اختیاری است، ولی درباره‌ی سابقه‌ی آسیب جسمی اعضا چیزی نمی‌پرسید.", "consequence": {"welfare": 0, "trust": 0, "risk": 2}}, {"text": "هدف تمرین را روشن می‌کنید، اختیاری بودن و آزادی ترک را تضمین می‌کنید، سابقه‌ی اعضا را بررسی می‌کنید و اگر شایستگی ندارید اجرا نمی‌کنید.", "consequence": {"welfare": 2, "trust": 1, "risk": -2}}, {"text": "تمرین را فقط برای اعضای بدون سابقه‌ی آسیب اجرا می‌کنید و دو نفر دیگر را به‌عنوان ناظر کنار گروه می‌نشانید تا درگیر نشوند.", "consequence": {"welfare": 1, "trust": 0, "risk": 1}}, {"text": "هر نوع فن فیزیکی را کنار می‌گذارید و فقط از بحث کلامی استفاده می‌کنید، حتی اگر اعضا چنین تمرینی را بخواهند.", "consequence": {"welfare": 1, "trust": 0, "risk": 0}}], "expert_ref": "فنون فیزیکی باید در خدمت نیاز اعضا باشند، نه ترفند؛ حمایت از اعضا (ص ۴۱)؛ فشار بیش از حد، آزادی شرکت نکردن و ترک گروه (ص ۴۱)؛ آماده‌سازی و هنجارهای گروه، انگیزه‌ی رهبر و شایستگی در کاربرد فنون (ص ۴۱).", "events": [], "source": "ص ۴۰–۴۱"}, {"id": "SC21", "concept": "C15", "track": "therapist", "spine": "S6", "brief": "شما سرپرست کارورزی هستید. کارورزی که در دو ارزیابی ضعف جدی در رازداری داشته، از شما توصیه‌نامه‌ی قوی برای ورود به دکتری می‌خواهد.", "options": [{"text": "با او صادقانه صحبت می‌کنید، ضعف‌ها و برنامه‌ی بهبود را روشن می‌کنید و فقط توصیه‌نامه‌ای می‌نویسید که با شناخت واقعی شما همخوان است.", "consequence": {"welfare": 2, "trust": 1, "risk": -2}}, {"text": "توصیه‌نامه‌ی قوی می‌نویسید ولی در جلسه‌ی خصوص     }

const $=id=>document.getElementById(id);

const score=o=>o.consequence.welfare+o.consequence.trust-o.consequence.risk;

const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
function listFor(axis){
  const l=PACK.scenarios.filter(s=>s.spine===axis);
  return l.sort((a,b)=>(a.track===state.track?0:1)-(b.track===state.track?0:1));
}
function renderMeters(){
  $("meters").innerHTML=METER_ORDER.map(([k,t,c])=>`<div class="meter"><div class="mh"><span>${t}</span><b class="circ" style="border-color:${c};color:${c}">${fa(state.m[k])}</b></div><div class="bar"><i style="width:${state.m[k]*10}%;background:${c}"></i></div></div>`).join("");
}
function axisPct(id){
  const l=PACK.scenarios.filter(s=>s.spine===id&&state.done[s.id]!==undefined);
  if(!l.length)return null;
  return Math.round(100*l.filter(s=>state.done[s.id]===bestIdx(s)).length/l.length);
}
function renderRadar(){
  const n=PACK.spine.length,R=80,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[r*Math.cos(a),r*Math.sin(a)]};
  let g="";
  [0.25,0.5,0.75,1].forEach(f=>{g+=`<polygon points="${PACK.spine.map((_,i)=>pt(i,R*f).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`});
  PACK.spine.forEach((s,i)=>{const [x,y]=pt(i,R);g+=`<line x1="0" y1="0" x2="${x}" y2="${y}" stroke="var(--line)"/>`;const [lx,ly]=pt(i,R+16);g+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${SHORT[s.id]}</text>`});
  const pts=PACK.spine.map((s,i)=>{const p=axisPct(s.id);return pt(i,R*(p===null?0:Math.max(p,4)/100)).join(",")});
  g+=`<polygon points="${pts.join(" ")}" fill="var(--accent)" fill-opacity=".25" stroke="var(--accent)" stroke-width="2"/>`;
  PACK.spine.forEach((s,i)=>{const p=axisPct(s.id);if(p!==null){const [x,y]=pt(i,R*Math.max(p,4)/100);g+=`<circle cx="${x}" cy="${y}" r="3.5" fill="var(--accent)"/>`}});
  $("radar").innerHTML=g;
}

  const nx=$("next");if(nx)nx.onclick=()=>{
    if(Object.keys(state.done).length>=PACK.scenarios.length&&state.end!==false){state.end=true;state.finished=Date.now();save();render();return}
    if(state.idx<l.length-1)state.idx++;else{const i=PACK.spine.findIndex(s=>s.id===state.axis);const nxt=PACK.spine.slice(i+1).find(s=>PACK.scenarios.some(x=>x.spine===s.id))||PACK.spine.find(s=>PACK.scenarios.some(x=>x.spine===s.id));state.axis=nxt.id;state.idx=0}
    render()};
}
function renderEnd(){
  const all=PACK.scenarios,best=all.filter(s=>state.done[s.id]===bestIdx(s)).length,pct=Math.round(100*best/all.length);
  const rows=PACK.spine.map(s=>{const p=axisPct(s.id);return p===null?"":`<div class="erow"><span>${s.name.split(" (")[0]}</span><div class="bar"><i style="width:${p}%;background:var(--accent)"></i></div><b>${fa(p)}٪</b></div>`}).join("");
  $("play").innerHTML=`<div class="crumb">اتاق تصمیم <span>/</span> پایان آزمون</div><h1 class="ptitle">آزمون به پایان رسید</h1><div class="card" style="margin-top:14px"><div class="tags"><span class="tag blue">پایان آزمون</span></div><p class="brief">به هر ${fa(all.length)} سناریو پاسخ دادید. ${fa(best)} پاسخ شما با نظر مرجع کتاب هم‌راستا بود (${fa(pct)}٪).</p>${rows}<div class="actions"><button class="btn" id="review">مرور پاسخ‌ها</button></div></div>`;
  $("review").onclick=()=>{state.end=false;state.axis="S1";state.idx=0;save();render()};
}
function showTab(){}
["student","therapist"].forEach(t=>$("t-"+t).onclick=()=>{state.track=t;state.idx=0;save();render()});
function render(){
  ["student","therapist"].forEach(t=>$("t-"+t).setAttribute("aria-pressed",state.track===t));
  renderMeters();renderRadar();renderAxes();renderPlay();save();
}
render();
</script>
</body>

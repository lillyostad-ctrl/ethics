<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اتاق تصمیم اخلاق بالینی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* layout: board pack. top meters strip, right rail with radar and axes, main column with the decision brief */
:root{
  --bg:#f5f6fa; --panel:#ffffff; --ink:#1c2230; --muted:#7f86a0; --line:#e7e9f1;
  --accent:#2f5fe8; --accent-soft:#eaf0ff; --good:#17a370; --warn:#e8a13a; --bad:#e5484d;
  --f-body:"Vazirmatn","Tahoma",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --panel:#171b24; --ink:#e8ebf3; --muted:#8f97ad; --line:#262c3a;
  --accent:#6d93ff; --accent-soft:#1c2540; --good:#3fcf93; --warn:#f0b35a; --bad:#f2767b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#171b24; --ink:#e8ebf3; --muted:#8f97ad; --line:#262c3a;
  --accent:#6d93ff; --accent-soft:#1c2540; --good:#3fcf93; --warn:#f0b35a; --bad:#f2767b; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.8;font-size:15px}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0 0 8px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;padding:8px 0 14px;border-bottom:2px solid var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink);padding:6px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
button:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.meter .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meter b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;transition:width .4s}
.grid{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}.meters{gap:6px}.meter{padding:8px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.rail{display:flex;flex-direction:column;gap:14px}
.axes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.axes button{width:100%;text-align:right;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 10px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.axes button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.axes small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 14px;border-radius:6px;font:inherit;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.chip{display:inline-block;font-size:12px;padding:1px 9px;border-radius:10px;background:var(--accent-soft);color:var(--accent);margin-inline-end:6px}
.brief{font-size:16px;margin:10px 0 14px}
.opt{display:block;width:100%;text-align:right;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.picked{border-color:var(--accent);border-width:2px}
.opt.best{background:color-mix(in srgb,var(--good) 10%,var(--panel))}
.delta{display:flex;gap:10px;font-size:12px;margin-top:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.delta span{padding:0 8px;border-radius:4px;background:var(--bg)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.ref,.evt{border-inline-start:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:4px;margin:12px 0}
.evt{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--panel))}
.src{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--panel);padding:7px 16px;border-radius:6px;font:inherit;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}

.authwrap{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;color-scheme:dark;background:radial-gradient(900px 500px at 50% 110%,#2a1030 0%,#0b0b0e 60%)}
.authcard{width:100%;max-width:400px;background:#131316;border:1px solid #25252b;border-radius:24px;padding:24px;color:#f4f4f6;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.authcard h2{font-size:26px;margin:22px 0 18px;color:#fff}
.pill{display:inline-flex;gap:4px;background:#0b0b0e;border:1px solid #25252b;border-radius:999px;padding:5px}
.pill button{border:0;background:none;color:#8b8b95;padding:8px 22px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
.pill button[aria-selected="true"]{background:#1d1d22;color:#fff}
.authcard form{display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.authcard input{width:100%;height:50px;background:#1a1a1f;border:1px solid #2a2a31;border-radius:14px;padding:0 14px;color:#fff;font:inherit}
.authcard input::placeholder{color:#6f6f79}
.authcard input:focus-visible{outline:2px solid #6b6bff;outline-offset:1px}
.field{position:relative;display:block}
.field svg{position:absolute;inset-inline-start:14px;top:16px;color:#6f6f79}
.field input{padding-inline-start:44px}
#authGo{height:50px;border:0;border-radius:14px;background:#f4f4f6;color:#0b0b0e;font:inherit;font-weight:700;cursor:pointer;margin-top:6px}
#authGo:hover{background:#fff}
#authMsg{min-height:20px;margin:12px 0 0;font-size:13px;color:#f0a3a3}
textarea{width:100%;min-height:64px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;resize:vertical}
.step{margin-bottom:12px}
.step label{font-weight:700;display:block}
.step .hint{font-size:12px;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}

/* ---- dashboard look: light cards, blue accent, soft pills ---- */
body{background:var(--bg)}
header{border-bottom:0;padding:6px 0 14px}
h1{font-size:24px;font-weight:700}
h2{font-size:15px;font-weight:700;color:var(--ink)}
.grid{grid-template-columns:270px 1fr;gap:16px}
.panel{border-radius:16px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,30,60,.04);padding:18px}
.meters{gap:12px}
.meter{border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.meter .row{align-items:center;font-size:13px}
.meter b{font-size:26px;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--accent-soft)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:8px;flex:none}
.seg{background:var(--accent-soft);border:0;border-radius:12px;padding:3px;gap:2px}
.seg button{border-radius:9px;color:var(--muted);padding:6px 16px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.axes{gap:2px}
.axes button{border:0;background:transparent;border-radius:10px;padding:9px 10px;align-items:center}
.axes button:hover{background:var(--bg)}
.axes button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.axes .al{display:flex;align-items:center}
.axes small{border:1px solid var(--line);border-radius:999px;padding:0 8px;background:var(--panel);color:var(--muted)}
.chip{border-radius:8px;padding:2px 10px;font-weight:500}
.chip.t{background:#f1eaff;color:#7442d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.t{background:#2a2143;color:#b79bff}}
.brief{font-size:17px;line-height:2;margin:14px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--panel)}
.opt:hover:not([disabled]){background:var(--accent-soft);border-color:var(--accent)}
.opt .ltr{flex:none;min-width:34px;height:28px;padding:0 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt .otxt{flex:1}
.opt.picked{border:1px solid var(--accent);background:var(--accent-soft)}
.opt.best{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--panel))}
.opt.best .ltr{background:var(--good);color:#fff}
.delta span{border-radius:999px;padding:0 10px;background:var(--bg)}
.ref,.evt{border:0;border-radius:14px;padding:14px 16px}
.ref{background:var(--accent-soft)}
.evt{background:color-mix(in srgb,var(--warn) 14%,var(--panel))}
.btn{border-radius:10px;padding:9px 20px;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.ghost{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
</style>
</head>
<body>
<div id="auth" hidden class="authwrap">
 <div class="authcard">
  <div class="pill" role="tablist"><button id="modeUp" type="button" aria-selected="true">ثبت‌نام</button><button id="modeIn" type="button" aria-selected="false">ورود</button></div>
  <h2 id="authTitle">ساخت حساب</h2>
  <form id="authForm">
   <div class="row2" id="nameRow"><input id="fn" placeholder="نام" autocomplete="given-name" aria-label="نام"><input id="ln" placeholder="نام خانوادگی" autocomplete="family-name" aria-label="نام خانوادگی"></div>
   <label class="field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><input id="em" type="email" required placeholder="ایمیل" autocomplete="email" aria-label="ایمیل" dir="ltr"></label>
   <label class="field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="pw" type="password" required minlength="8" placeholder="رمز عبور" autocomplete="new-password" aria-label="رمز عبور" dir="ltr"></label>
   <button id="authGo" type="submit">ساخت حساب</button>
  </form>
  <p id="authMsg" role="status"></p>
 </div></div>
<div class="wrap">
<header>
  <div>
    <h1>اتاق تصمیم اخلاق بالینی</h1>
  </div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="sub" id="who"></span><button class="btn ghost" id="logout" hidden>خروج</button><div class="seg" role="group" aria-label="مسیر"><button id="t-student" aria-pressed="true">دانشجو</button><button id="t-therapist" aria-pressed="false">درمانگر</button></div></div>
</header>

<div class="meters" id="meters"></div>

<div class="grid">
  <div class="rail">
    <div class="panel"><h2>میزان تسلط در هر بخش</h2><svg id="radar" viewBox="-130 -115 260 230" width="100%" role="img" aria-label="میزان تسلط در هر بخش"></svg></div>
    <div class="panel"><h2>محورها</h2><ul class="axes" id="axes"></ul></div>
  </div>
  <main>
    <section id="play" class="panel"></section>
  </main>
</div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const PACK = {"book": {"title": "راهنمای اخلاق و رفتار حرفه‌ای در روانشناسی بالینی (برای روانشناسان، مشاوران و روانپزشکان)", "edition": "عاطف‌وحید و دادفر، میرماه، ۱۳۹۳، ۱۳۶ ص", "license": "تأیید کاربر: نسخه‌ی قانونی در اختیار کاربر است. هیچ متنی از کتاب کپی نشده؛ سناریوها تازه نوشته شده‌اند و فقط ارجاع صفحه دارند."}, "audience": ["student (دانشجو/کارورز)", "therapist (درمانگر)"], "meters": {"welfare": "رفاه و ایمنی مراجع (بالاتر بهتر)", "trust": "اعتماد مراجع/همکار/ناظر (بالاتر بهتر)", "risk": "ریسک حرفه‌ای و حقوقی (بالاتر بدتر)"}, "meter_note": "اعداد پیامد طراحی بازی هستند، نه ادعای کتاب. جهت و منطق آن‌ها با expert_ref و ارجاع صفحه پشتیبانی می‌شود. تأیید SME لازم است.", "spine": [{"id": "S1", "name": "صلاحیت", "weight": 1, "source": "ص ۹۱–۹۲"}, {"id": "S2", "name": "مسئولیت و روابط حرفه‌ای (روابط چندگانه)", "weight": 1.5, "source": "ص ۹۳–۹۴، ۹۷"}, {"id": "S3", "name": "رازداری و حدود آن", "weight": 2, "source": "ص ۹۵، ۲۸–۳۰"}, {"id": "S4", "name": "سنجش و ارزیابی", "weight": 1, "source": "ص ۹۵–۹۶"}, {"id": "S5", "name": "مداخله‌های روانشناختی (فردی، گروه، زوج/خانواده)", "weight": 1.5, "source": "ص ۹۷، ۴۰–۴۳"}, {"id": "S6", "name": "آموزش، کارورزی و نظارت", "weight": 1, "source": "ص ۹۸–۹۹، ۳۳–۳۵"}, {"id": "S7", "name": "پژوهش و انتشار", "weight": 1, "source": "ص ۹۹–۱۰۱"}, {"id": "S8", "name": "تبلیغات و حل تعارض اخلاقی", "weight": 1, "source": "ص ۱۰۲–۱۰۳"}], "capstone_model": {"name": "مدل ۹ گامی تصمیم‌گیری اخلاقی (کیچنر ۱۹۸۴)", "source": "ص ۳۱–۳۶", "steps": ["حساسیت اخلاقی", "شناسایی مسئله و راه‌حل‌ها", "مرور نظام‌نامه", "مرور ادبیات", "به‌کارگیری اصول اخلاقی", "مشورت با همکار/ناظر", "تفکر و تصمیم", "اطلاع به ناظر و ثبت اقدام", "بازتاب بر عمل"], "note": "این مدل روی همه‌ی محورها اجرا می‌شود و در ماه‌های آخر کارنامه‌ی نهایی است."}, "concepts": [{"id": "C1", "spine": "S1", "definition": "ارائه‌ی خدمت، پژوهش و آموزش فقط در حوزه‌ای که صلاحیت آن احراز شده؛ در غیر این صورت مشورت یا ارجاع.", "source": "ص ۹۱–۹۲"}, {"id": "C2", "spine": "S1", "definition": "در بحران و اضطرار، تا فراهم شدن خدمت تخصصی کافی، کمک‌رسانی حتی بدون آموزش تخصصی؛ با فراهم شدن خدمت مناسب، توقف.", "source": "ص ۹۲"}, {"id": "C3", "spine": "S1", "definition": "از دست دادن پروانه به دلیل کار خارج از حوزه‌ی صلاحیت (پرونده‌ی کوپر ۱۹۷۵).", "source": "ص ۳۰"}, {"id": "C4", "spine": "S2", "definition": "پرهیز از رابطه‌ی غیرحرفه‌ای با مراجع، پرهیز از سوءاستفاده از رابطه، و عدم رابطه‌ی جنسی؛ ازدواج با مراجع فقط پس از حداقل ۲ سال از پایان یا توقف مداخله.", "source": "ص ۹۴، ۹۷"}, {"id": "C5", "spine": "S2", "definition": "اطلاع‌رسانی مالی و کسب توافق آگاهانه پیش از درمان؛ دریافت حق‌الزحمه طبق تعرفه.", "source": "ص ۹۳، ۹۷"}, {"id": "C6", "spine": "S2", "definition": "مواجهه با تخلف همکار: تذکر، سپس اطلاع به مسئول بالاتر، سپس کمیسیون رسیدگی به تخلفات سازمان نظام.", "source": "ص ۹۴، ۱۰۳"}, {"id": "C7", "spine": "S3", "definition": "نقض رازداری فقط در سه مورد: رضایت مراجع یا قیم (به شرط ضرر نرساندن)، خطر جانی برای مراجع یا دیگران، بیماری مسری کشنده در صورت حکم قانون یا مرجع قانونی. حداقل افشا و آگاه‌کردن مراجع تا حد ممکن.", "source": "ص ۹۵"}, {"id": "C8", "spine": "S3", "definition": "وظیفه‌ی هشدار به قربانی قابل‌پیش‌بینی (تاراسوف ۱۹۷۶). دادگاه‌های بعدی در برخی ایالت‌ها آن را به قربانی قابل‌شناسایی محدود کردند (تامپسون ۱۹۸۰).", "source": "ص ۲۸–۳۰"}, {"id": "C9", "spine": "S3", "definition": "ارتباط آزاد در درمان به اطمینان از رازداری وابسته است (لایف‌شوتز ۱۹۷۰).", "source": "ص ۲۸"}, {"id": "C10", "spine": "S4", "definition": "فقط آزمون معتبر؛ فقط با صلاحیت؛ هدفمند؛ جلوگیری از اجرا و تفسیر توسط افراد فاقد صلاحیت؛ ارائه‌ی نتایج به درخواست کتبی مراجع، قیم یا دادگاه با رعایت منافع مراجع.", "source": "ص ۹۵–۹۶"}, {"id": "C11", "spine": "S4", "definition": "نگهداری سوابق ارزیابی حداقل ۵ سال پس از درمان؛ برای کودکان و نوجوانان تا سن قانونی. پاسخنامه و گزارش در پرونده.", "source": "ص ۹۶"}, {"id": "C12", "spine": "S5", "definition": "رضایت آگاهانه پیش از هر مداخله؛ اگر روش پشتوانه‌ی پژوهشی کافی ندارد، آگاه‌سازی و جلب موافقت؛ اعلام وضعیت آموزشی درمانگر.", "source": "ص ۹۷"}, {"id": "C13", ert_ref": "پرهیز از رابطه‌ی غیرحرفه‌ای و سوءاستفاده از رابطه‌ی حرفه‌ای (ص ۹۴)؛ پرهیز از رابطه‌ی جنسی؛ ازدواج با مراجع فقط پس از حداقل ۲ سال از پایان یا توقف مداخله (ص ۹۷). ثبت تصمیم (ص ۳۶).", "events": ["مراجع می‌گوید همکار دیگری با مراجعانش رابطه دارد → مسیر تذکر، مسئول بالاتر، کمیسیون (ص ۹۴، ۱۰۳)."], "source": "ص ۹۴، ۹۷، ۳۶"}, {"id": "SC03", "concept": "C7,C8", "track": "therapist", "spine": "S3", "brief": "مراجع در جلسه می‌گوید قصد دارد همسر سابقش را که نام او را می‌دانید «تنبیه» کند. بعد می‌گوید شوخی بوده. او رازداری را به‌شدت مهم می‌داند.", "options": [{"text": "خطر را ارزیابی می‌کنید و بدون مشورت، نام و جزئیات کامل پرونده را برای پلیس و خانواده‌ی مراجع می‌فرستید.", "consequence": {"welfare": 1, "trust": -2, "risk": 1}}, {"text": "با مراجع درباره‌ی جدی بودن حرفش صحبت می‌کنید، قول عدم اقدام می‌گیرید، جلسه‌ی بعد را زودتر می‌گذارید و موضوع را ثبت می‌کنید.", "consequence": {"welfare": 1, "trust": 1, "risk": 1}}, {"text": "خطر را ارزیابی می‌کنید، با ناظر مشورت می‌کنید (با پنهان‌سازی هویت)، اگر خطر جدی ماند حداقل اطلاعات لازم را به مرجع یا فرد در معرض خطر می‌دهید و مراجع را در جریان می‌گذارید.", "consequence": {"welfare": 3, "trust": -1, "risk": -2}}, {"text": "چون حرف مبهم و شوخی‌مانند بود، فقط ثبت می‌کنید و در جلسات بعد دقیق‌تر پیگیری می‌کنید مگر تهدید تکرار شود.", "consequence": {"welfare": 1, "trust": 1, "risk": 2}}], "expert_ref": "نقض رازداری در خطر جانی برای دیگران مجاز است؛ افشا در حداقل ممکن و آگاه‌کردن مراجع تا حد ممکن (ص ۹۵). پرونده‌ی تاراسوف: وظیفه‌ی اقدام منطقی برای حفظ جان قربانی قابل‌پیش‌بینی (ص ۲۸–۲۹). مشورت در هر مرحله (ص ۳۳).", "events": ["تهدید مبهم می‌شود و نام فرد مشخص نیست. در پرونده‌ی تامپسون وظیفه‌ی هشدار به قربانی قابل‌شناسایی محدود شد، ولی برخی ایالات نپذیرفتند (ص ۳۰). قانون محل خود را بررسی کنید (ص ۹۳)."], "source": "ص ۹۵، ۲۸–۳۰، ۳۳"}, {"id": "SC04", "concept": "C10,C11", "track": "therapist", "spine": "S4", "brief": "والد یک نوجوان می‌خواهد نتایج آزمون فرزندش را ببیند. نوجوان از شما خواسته نتایج را به پدر ندهید چون می‌ترسد تنبیه شود. یک کارآموز هم پیشنهاد می‌کند خودش نمره‌گذاری را انجام دهد.", "options": [{"text": "نتایج را فقط به نوجوان می‌دهید و به والد می‌گویید قانوناً حق دیدن ندارد.", "consequence": {"welfare": -1, "trust": 1, "risk": 2}}, {"text": "درخواست والد را می‌پذیرید و همه‌ی نتایج را بدون ارزیابی آسیب احتمالی می‌دهید، چون او قیم قانونی است.", "consequence": {"welfare": -1, "trust": 0, "risk": 1}}, {"text": "درخواست کتبی والد را می‌گیرید ولی نتایج را بدون بررسی آسیب و بدون توضیح می‌دهید، چون تشخیص منافع نوجوان با والد است.", "consequence": {"welfare": 0, "trust": 0, "risk": 1}}, {"text": "درخواست کتبی والد را می‌گیرید، آسیب احتمالی را با نوجوان و در صورت لزوم ناظر بررسی می‌کنید، نتایج را با توضیح و در حد لازم می‌دهید و پاسخنامه و گزارش را در پرونده نگه می‌دارید.", "consequence": {"welfare": 2, "trust": 1, "risk": -1}}], "expert_ref": "نتایج به درخواست کتبی مراجع، قیم یا دادگاه با رعایت منافع مراجع، مگر در صورت آسیب یا سوءاستفاده (ص ۹۶). اجازه‌ی اجرا و تفسیر به فرد فاقد صلاحیت ممنوع (ص ۹۶). نگهداری سوابق تا سن قانونی نوجوان (ص ۹۶).", "events": ["دادگاه رسماً پرونده را مطالبه می‌کند."], "source": "ص ۹۶"}, {"id": "SC05", "concept": "C14", "track": "therapist", "spine": "S5", "brief": "در زوج‌درمانی، شوهر در یک جلسه‌ی فردی می‌گوید رابطه‌ی بیرونی دارد و می‌خواهد پنهان بماند. همسر بعداً از شما می‌خواهد در دادگاه طلاق شهادت دهید.", "options": [{"text": "در جلسه‌ی مشترک از شوهر می‌خواهید خودش به همسر بگوید و اگر نگفت، خودتان موضوع را مطرح می‌کنید.", "consequence": {"welfare": 0, "trust": -1, "risk": 2}}, {"text": "روشن می‌کنید هر دو مراجع‌اند، بدون درخواست کتبی چیزی را برملا نمی‌کنید، پنهان‌کاری را به‌عنوان مانع درمان با شوهر مطرح می‌کنید، شهادت علیه یکی را نمی‌پذیرید و اگر درمان بی‌نتیجه ماند ارجاع می‌دهید.", "consequence": {"welfare": 2, "trust": 1, "risk": -2}}, {"text": "شهادت را رد می‌کنید و درمان را ادامه می‌دهید، ولی درباره‌ی پنهان‌کاری شوهر با او صحبت نمی‌کنید.", "consequence": {"welfare": 1, "trust": 1, "risk": 1}}, {"text": "به درخواست کتبی همسر، خلاصه‌ی روند درمان را بدون اشاره به رابطه‌ی بیرونی به دادگاه می‌دهید.", "consequence": {"welfare": 0, "trust": -1, "risk": 2}}], "expert_ref": "در زوج/خانواده‌درمانی افشا بدون درخواست کتبی ممنوع است (ص ۴۳)؛ نقش‌های متعارض مثل درمانگر و شاهد باید تعدیل یا پرهیز شود (ص ۴۲)؛ شهادت علیه یکی از زوجین در دادگاه ممنوع (ص ۹۷). در صورت بی‌نتیجه بودن درمان، ارجاع و عدم رهاسازی بدون تدبیر (ص ۴۳).", "events": ["دادگاه حکم احضار می‌دهد → قانون در برابر اخلاق: ابتدا تلاش برای حل، سپس پایبندی به قانون (ص ۱۰۳)."], "source": "ص ۴۲–۴۳، ۹۷، ۱۰۳"}, {"id": "SC06", "concept": "C15", "track": "therapist", "spine": "S6", "brief": "یکی از کارورزان شما می‌گوید بعد از طلاق افسرده است و از شما می‌خواهد «چند جلسه» درمانش کنید. در همان حال، برادرزاده‌تان هم می‌خواهد کارورز شما شود.", "options": [{"text": "کارورز را به متخصص ارجاع می‌دهید ولی برادرزاده را می‌پذیرید، با این استدلال که نظارت شما دقیق‌تر خواهد بود.", "consequence": {"welfare": 1, "trust": 0, "risk": 1}}, {"text": "برادرزاده را رد می‌کنید و برای کارورز چند جلسه‌ی «مشورت غیررسمی» می‌گذارید تا بحران بگذرد، بعد ارجاع می‌دهید.", "consequence": {"welfare": 1, "trust": 0, "risk": 1}}, {"text": "هر دو را می‌پذیرید ولی برای هر کدام قرارداد نظارتی جداگانه می‌نویسید.", "consequence": {"welfare": -1, "trust": -1, "risk": 2}}, {"text": "کارورز را بدون ارائه‌ی درمان به متخصص واجد شرایط ارجاع می‌دهید، مرز حرفه‌ای را در نظارت حفظ می‌کنید، برادرزاده را نمی‌پذیرید و دلیل را برای هر دو توضیح می‌دهید.", "consequence": {"welfare": 2, "trust": 1, "risk": -2}}], "expert_ref": "ارائه‌ی خدمت درمانی به دانشجو/کارآموز ممنوع و ارجاع لازم است؛ پذیرش بستگان نزدیک ممنوع؛ حفظ مرزها (ص ۹۸–۹۹).", "events": ["کارورز در جلسه‌ی نظارت اشتباه جدی می‌کند و باید بازخورد بگیرد (ص ۹۸)."], "source": "ص ۹۸–۹۹"}, {"id": "SC07", "concept": "C17", "track": "therapist", "spine": "S7", "brief": "برای پژوهش می‌خواهید بدون گفتن هدف واقعی از شرکت‌کنندگان داده بگیرید. روش دیگری هم وجود دارد ولی ۳ ماه بیشتر زمان می‌برد.", "options": [{"text": "پنهان‌کاری را فقط در صورتی نگه می‌دارید که کمیته‌ی اخلاق تأیید کند منافع از ضرر بیشتر است و روش جایگزین عملی نیست؛ وگرنه روش جایگزین را با سه ماه تأخیر اجرا می‌کنید.", "consequence": {"welfare": 1, "trust": 2, "risk": -2}}, {"text": "هدف جزئی را پنهان می‌کنید و رضایت‌نامه‌ی کتبی را کامل می‌گیرید، بدون مراجعه به کمیته چون ریسک کم است.", "consequence": {"welfare": 0, "trust": 1, "risk": 1}}, {"text": "هدف را از ابتدا کامل می‌گویید ولی چون ممکن است روی نتایج اثر بگذارد، رضایت را شفاهی می‌گیرید.", "consequence": {"welfare": 0, "trust": 0, "risk": 2}}, {"text": "پنهان‌کاری را اجرا می‌کنید ولی در پایان به هر شرکت‌کننده توضیح می‌دهید و حق حذف داده را می‌دهید.", "consequence": {"welfare": 0, "trust": 1, "risk": 1}}], "expert_ref": "پنهان‌کاری فقط وقتی منافع بیشتر از ضرر است و راه دیگری نیست (ص ۱۰۰)؛ رضایت آگاهانه‌ی کتبی (ص ۹۹)؛ در صورت تردید، تصویب کمیته‌ی اخلاق (ص ۹۹)؛ مشارکت داوطلبانه و بدون تبعات منفی (ص ۹۹).", "events": ["شرکت‌کننده می‌خواهد در میانه‌ی پژوهش انصراف دهد (ص ۱۰۰)."], "source": "ص ۹۹–۱۰۰"}, {"id": "SC08", "concept": "C20,C19", "track": "therapist", "spine": "S8", "brief": "مدیر کلینیک دستور می‌دهد در تبلیغات بنویسید «بهبودی ۱۰۰٪» و پرونده‌ی مراجعان را برای تبلیغ بیمه‌ها در اختیار بخش بازاریابی بگذارید.", "options": [{"text": "تبلیغ را با عدد واقعی بازنویسی می‌کنید و چون پرونده‌ها بی‌نام می‌شوند، اجازه می‌دهید بازاریابی از آن‌ها استفاده کند.", "consequence": {"welfare": 0, "trust": 0, "risk": 1}}, {"text": "هر دو دستور را رد می‌کنید و بدون اطلاع به مدیر، تبلیغ را خودتان اصلاح می‌کنید.", "consequence": {"welfare": 1, "trust": 0, "risk": 1}}, {"text": "بیانیه‌ی «بهبودی ۱۰۰٪» و استفاده‌ی بازاریابی از پرونده‌ها را کتباً رد می‌کنید، دلیل را با ارجاع به ضوابط اخلاقی می‌گویید، جایگزین مستند پیشنهاد می‌دهید و در صورت اصرار با کمیته‌ی اخلاق یا سازمان نظام مشورت می‌کنید.", "consequence": {"welfare": 2, "trust": 1, "risk": -1}}, {"text": "فقط از پرونده‌ها محافظت می‌کنید و درباره‌ی «بهبودی ۱۰۰٪» چیزی نمی‌گویید چون موضوع بازاریابی است.", "consequence": {"welfare": 1, "trust": 0, "risk": 1}}], "expert_ref": "اظهارات کذب درباره‌ی میزان موفقیت خدمات ممنوع (ص ۱۰۲)؛ تعارض اخلاق با مقررات سازمان → پیروی از اخلاق حرفه‌ای (ص ۱۰۳)؛ رازداری (ص ۹۵).", "events": ["همکار شما همین تبلیغ را منتشر می‌کند → تذکر، مسئول بالاتر، کمیسیون (ص ۱۰۳)."], "source": "ص ۱۰۲–۱۰۳، ۹۵"}, {"id": "SC09", "concept": "C16", "track": "student", "spine": "S6", "brief": "کارورز هستید. در جلسه‌ی اول، مراجعی مشکل پیچیده‌ای مطرح می‌کند. دوستتان در گروه تلگرامی می‌گوید «همه‌چیز را بنویس با اسم تا نظر بدهیم».", "options": [{"text": "پرونده را بی‌نام می‌کنید و فقط با دوستتان مشورت می‌کنید، چون ناظر امروز در دسترس نیست.", "consequence": {"welfare": 0, "trust": 0, "risk": 1}}, {"text": "با ناظر مشورت می‌کنید و تا پاسخ او منتظر می‌مانید؛ در گروه فقط پرسش کلی بدون هویت و جزئیات قابل‌شناسایی می‌پرسید.", "consequence": {"welfare": 1, "trust": 2, "risk": -2}}, {"text": "از مراجع رضایت می‌گیرید تا با دوستان هم‌دوره مشورت کنید و بعد با ناظر هماهنگ می‌کنید.", "consequence": {"welfare": 0, "trust": 1, "risk": 1}}, {"text": "مشورت نمی‌کنید و بر اساس آموزش دانشگاه جلسه را پیش می‌برید تا پرونده پخش نشود.", "consequence": {"welfare": -1, "trust": 0, "risk": 2}}], "expert_ref": "مشورت در هر مرحله؛ اطلاعات هویتی فقط با رضایت مراجع یا قانون، وگرنه هویت پنهان (ص ۳۳–۳۴)؛ برای فرد تحت نظارت مشورت با ناظر الزامی و نظر ناظر وزن بیشتری دارد (ص ۳۴)؛ فرد فاقد پروانه هم ملزم به معیارهای حرفه‌ای است (ص ۳۴).", "events": ["ناظر پاسخ نمی‌دهد و جلسه فردا است."], "source": "ص ۳۳–۳۴"}, {"id": "SC10", "concept": "C18", "track": "student", "spine": "S7", "brief": "پایان‌نامه‌ی شما تمام شده. استاد راهنما می‌خواهد نام یک همکار که هیچ نقشی نداشته به‌عنوان نویسنده‌ی اول اضافه شود و نام شما سوم باشد.", "options": [{"text": "می‌پذیرید همکار نویسنده‌ی دوم باشد چون داده‌ی اولیه را فراهم کرده، بدون اینکه بپرسید چه نقشی داشته.", "consequence": {"welfare": 0, "trust": 0, "risk": 1}}, {"text": "با استاد صحبت نمی‌کنید و مقاله را با نام خود و استاد ارسال می‌کنید تا درگیری پیش نیاید.", "consequence": {"welfare": 0, "trust": -1, "risk": 1}}, {"text": "درخواست را رد می‌کنید و می‌گویید به کمیته‌ی اخلاق شکایت می‌کنید.", "consequence": {"welfare": 0, "trust": -1, "risk": 1}}, {"text": "در جلسه‌ی خصوصی با ارجاع به اصل عدم پذیرش اعتبار کار انجام‌نشده و جایگاه دانشجو در مقاله‌ی پایان‌نامه توضیح می‌دهید، نقش واقعی هر نفر را فهرست می‌کنید و در صورت ادامه‌ی اختلاف از کمیته‌ی اخلاق مشورت می‌خواهید.", "consequence": {"welfare": 1, "trust": 2, "risk": -1}}], "expert_ref": "عدم پذیرش اعتبار کاری که انجام نشده؛ در مقاله‌ی برگرفته از پایان‌نامه نام دانشجو نویسنده‌ی اول است مگر نقشی نداشته باشد؛ ممنوعیت داده‌سازی (ص ۱۰۱). درج غیراخلاقی نام نویسندگان (میهمان/شبح) در فهرست کتاب (ص ۶۲).", "events": ["داور یک داده را مشکوک می‌داند → اصلاح خطا در اطلاعات منتشرشده (ص ۱۰۱)."], "source": "ص ۱۰۱، ۶۲"}, {"id": "SC11", "concept": "C1,C3", "track": "student", "spine": "S1", "brief": "در بخش بالینی، سرپرست می‌گوید یک آزمون پیچیده را اجرا کنید، ولی دوره‌ی آن را ندیده‌اید.", "options": [{"text": "محدودیت خود را به سرپرست می‌گویید، پیشنهاد می‌کنید آزمون پس از آموزش و تحت نظارت انجام شود و تا آن زمان در بخش‌هایی که صلاحیتشان را دارید کمک می‌کنید.", "consequence": {"welfare": 2, "trust": 1, "risk": -2}}, {"text": "آزمون را با راهنمای کتابچه اجرا می‌کنید و نمره‌گذاری را دقیق با سرپرست چک می‌کنید.", "consequence": {"welfare": 0, "trust": 1, "risk": 1}}, {"text": "اجرا را به همکار دارای صلاحیت می‌سپارید ولی تفسیر را خودتان می‌نویسید.", "consequence": {"welfare": 0, "trust": 0, "risk": 2}}, {"text": "کار را می‌پذیرید و پیش از جلسه با یک دوره‌ی کوتاه آنلاین مهارت را کسب می‌کنید.", "consequence": {"welfare": -1, "trust": 0, "risk": 1}}], "expert_ref": "فقط آزمون‌هایی که صلاحیت آن‌ها کسب شده (ص ۹۶)؛ فقط روش‌هایی که آموزش دیده‌اید (ص ۹۱)؛ تلاش پیوسته برای توسعه‌ی صلاحیت (ص ۹۲).", "events": ["سرپرست اصرار می‌کند و می‌گوید «همه این کار را می‌کنند»."], "source": "ص ۹۱–۹۲، ۹۶"}, {"id": "SC12", "concept": "C13", "track": "student", "spine": "S5", "brief": "به‌عنوان همرهبر در گروه‌درمانی مشاهده می‌کنید رهبر برای فعال کردن یک عضو ساکت فشار زیادی می‌آورد و می‌گوید «همه باید حرف بزنند».", "options": [{"text": "بعد از جل ام کرده بودید (ص ۹۸)."], "source": "ص ۹۸–۹۹"}, {"id": "SC22", "concept": "C17", "track": "student", "spine": "S7", "brief": "برای پایان‌نامه می‌خواهید پرسشنامه‌ی بی‌نام درباره‌ی استرس را در کلاسی که دستیار آموزشی آن هستید توزیع کنید. بعضی دانشجویان نگرانند شرکت نکردن بر نمره اثر بگذارد.", "options": [{"text": "پرسشنامه را اجباری اعلام می‌کنید تا نرخ پاسخ بالا برود و نمره‌ی مشارکت می‌دهید.", "consequence": {"welfare": 0, "trust": -1, "risk": 2}}, {"text": "پرسشنامه‌ی بی‌نام را توزیع می‌کنید و چون بی‌نام است توضیح درباره‌ی داوطلبانه بودن و انصراف را لازم نمی‌دانید.", "consequence": {"welfare": 0, "trust": 0, "risk": 1}}, {"text": "فقط دانشجویانی را دعوت می‌کنید که با شما صمیمی‌اند.", "consequence": {"welfare": 0, "trust": -1, "risk": 1}}, {"text": "پرسشنامه‌ی بی‌نام را با برگه‌ی اطلاعات (هدف، داوطلبانه بودن، حق انصراف، رازداری، تماس) توزیع می‌کنید، تصریح می‌کنید نپذیرفتن پیامدی ندارد و در صورت تردید طرح را به کمیته‌ی اخلاق می‌برید.", "consequence": {"welfare": 1, "trust": 2, "risk": -2}}], "expert_ref": "شرکت داوطلبانه و بدون پیامد منفی برای نپذیرفتن (ص ۹۹)؛ در پرسشنامه‌ی بی‌نام و بدون خطر می‌توان از توافق آگاهانه‌ی کتبی صرف‌نظر کرد (ص ۱۰۰)؛ تردید → کمیته‌ی اخلاق (ص ۹۹)؛ رازداری اطلاعات شرکت‌کنندگان (ص ۱۰۰).", "events": ["استاد فهرست پاسخ‌دهندگان را می‌خواهد؛ بی‌نامی و رازداری را بازبینی می‌کنید (ص ۱۰۰)."], "source": "ص ۹۹–۱۰۰"}, {"id": "SC23", "concept": "C18", "track": "therapist", "spine": "S7", "brief": "مقاله‌ای منتشر کرده‌اید. متوجه می‌شوید در کدگذاری یک متغیر خطا بوده و یکی از نتایج اصلی تغییر می‌کند. مقاله چند بار ارجاع داده شده است.", "options": [{"text": "به ویراستار و هم‌نویسندگان اطلاع می‌دهید، تحلیل را اصلاح می‌کنید و تصحیح را به شکل مناسب منتشر می‌کنید.", "consequence": {"welfare": 1, "trust": 2, "risk": -2}}, {"text": "خطا را در مقاله‌ی بعدی با عبارت «نتایج دقیق‌تر» اصلاح می‌کنید و به مقاله‌ی قبلی کاری ندارید.", "consequence": {"welfare": 0, "trust": 0, "risk": 2}}, {"text": "فقط به هم‌نویسندگان می‌گویید و منتظر می‌مانید کسی اعتراض کند.", "consequence": {"welfare": 0, "trust": 1, "risk": 1}}, {"text": "نتیجه‌ی جدید را در مقاله‌ی بعدی به‌عنوان «یافته‌ی جدید» ارائه می‌دهید، بدون اشاره به خطای قبلی.", "consequence": {"welfare": 0, "trust": 0, "risk": 2}}], "expert_ref": "در صورت خطا در اطلاعات منتشرشده، اصلاح مقتضی (ص ۱۰۱)؛ ارائه‌ی اطلاعات دروغین و ارائه‌ی داده‌ی قدیمی به‌عنوان جدید ممنوع (ص ۱۰۱)؛ مسئولیت علمی و اخلاقی مجری و سایر مشارکان (ص ۱۰۱).", "events": ["پژوهشگری دیگر بر پایه‌ی نتیجه‌ی اشتباه پژوهش ادامه داده؛ مسئولیت جلوگیری از سوءتعبیر (ص ۱۰۱)."], "source": "ص ۱۰۱"}, {"id": "SC24", "concept": "C19", "track": "student", "spine": "S8", "brief": "دانشجوی کارشناسی ارشد هستید و صفحه‌ای در شبکه‌های اجتماعی دارید. دنبال‌کننده‌ها پرسش شخصی می‌پرسند و دوستی پیشنهاد می‌کند در معرفی بنویسید «روانشناس بالینی» تا اعتبار بگیرید.", "options": [{"text": "می‌نویسید «روانشناس بالینی» چون در همین رشته تحصیل می‌کنید.", "consequence": {"welfare": 0, "trust": -1, "risk": 2}}, {"text": "می‌نویسید «دانشجوی روانشناسی بالینی» ولی به پرسش‌های شخصی پاسخ فردی و راهکار درمانی می‌دهید.", "consequence": {"welfare": 1, "trust": 0, "risk": 2}}, {"text": "عنوان واقعی و مدرک کسب‌شده را می‌نویسید، محتوای عمومی مبتنی بر دانش روز و در حد صلاحیت می‌گذارید، به پرسش‌های فردی مشاوره‌ی درمانی نمی‌دهید و روشن می‌کنید این محتوا رابطه‌ی حرفه‌ای ایجاد نمی‌کند.", "consequence": {"welfare": 2, "trust": 1, "risk": -1}}, {"text": "صفحه را کاملاً می‌بندید تا خطای اخلاقی پیش نیاید.", "consequence": {"welfare": 1, "trust": 0, "risk": 0}}], "expert_ref": "استفاده فقط از درجات علمی دریافت‌شده و عدم استفاده از عناوین کسب‌نشده (ص ۹۱)؛ پرهیز از اظهار کذب درباره‌ی مدارک و صلاحیت‌ها؛ توصیه‌ی عمومی بر پایه‌ی دانش روز، در چارچوب صلاحیت و بدون دلالت بر برقراری رابطه‌ی حرفه‌ای (ص ۱۰۲).", "events": ["صفحه‌ای دیگر شما را «روانشناس» معرفی می‌کند؛ اطلاعات نادرست را در اسرع وقت اصلاح می‌کنید (ص ۱۰۲)."], "source": "ص ۹۱، ۱۰۲"}], "dossier_templates": [{"id": "D1", "name": "برگه‌ی ۹ گامی تصمیم اخلاقی", "source": "ص ۳۱–۳۶", "use": "برای یک مورد واقعی کار خود پر کنید؛ از گام دوم فهرست راه‌حل‌ها را یادداشت کنید (ص ۳۶)."}, {"id": "D2", "name": "پرسش‌های مشورت با همکار/ناظر", "source": "ص ۳۴", "use": "واقعیت‌ها، درک شما از معیارها، تفسیر، ارزیابی فعلی؛ سپس پرسش‌های بازخورد."}, {"id": "D3", "name": "چک‌لیست رضایت آگاهانه (درمان و پژوهش)", "source": "ص ۹۴، ۹۷، ۹۹–۱۰۰", "use": "زبان قابل‌فهم، مالی، وضعیت آموزشی، روش بدون پشتوانه، حق انصراف، محدودیت رازداری."}, {"id": "D4", "name": "جدول نگهداری سوابق", "source": "ص ۹۶–۹۷", "use": "حداقل ۵ سال؛ کودکان تا سن قانونی؛ ایمن‌سازی پرونده."}, {"id": "D5", "name": "بازتاب بر عمل (گام ۹)", "source": "ص ۳۶", "use": "پرسش‌های بازتاب کتاب را بعد از هر مورد پاسخ دهید."}], "fit": {"score": "medium-high", "notes": "ساختار صریح ۱۰ استاندارد، مدل ۹ گامی و پرونده‌های دادگاهی. ضعف: بدون معیار عددی؛ بخش قوانین بهداشت روان (ص ۱۱۲–۱۲۲) و بخش‌هایی از اخلاق پژوهش به‌صورت سناریو پوشش داده نشد. پرونده‌های آمریکایی قانون ایران نیستند (ص ۳۰، ۱۰۳)."}};
const SHORT = {S1:"صلاحیت",S2:"روابط",S3:"رازداری",S4:"سنجش",S5:"مداخله",S6:"نظارت",S7:"پژوهش",S8:"تعارض"};
const PAL=["#2f5fe8","#8a5cf6","#17a370","#e8a13a","#e5484d","#0ea5c6","#d9569b","#64748b"];
const LET=["الف","ب","ج","د"];
const METER_ORDER=[["welfare","رفاه مراجع","var(--good)"],["trust","اعتماد","var(--accent)"],["risk","ریسک حرفه‌ای","var(--bad)"]];
const STEPS = PACK.capstone_model.steps;
const HINTS = ["چه بعد اخلاقی در این موقعیت دیده نشده بود؟","نوع تعارض چیست؟ همه‌ی راه‌حل‌ها را بدون سانسور بنویسید.","کدام بند نظام‌نامه مرتبط است؟ (ص ۹۰–۱۰۳)","کدام منبع یا همکار با موضوع مشابه درگیر بوده؟","استقلال، عدم آسیب، نیکوکاری، عدالت، وفاداری (ص ۳۳)","با چه کسی مشورت کردید؟ از پرسش‌های ص ۳۴ استفاده کنید.","کدام راه‌حل اخلاقی‌تر است و بهای آن چیست؟","چه کسی باید مطلع شود؟ تصمیم و دلیل را ثبت کنید.","چه چیز را می‌توانستید متفاوت انجام دهید؟ (ص ۳۶)"];
let state={track:"student",axis:"S1",idx:0,m:{welfare:5,trust:5,risk:3},done:{},evt:{},dossier:Array(9).fill("")};
const CFG=window.APP_CONFIG||{};
const sb=(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase)?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
let me=null,saveTimer=null;
function setSync(m){const e=document.getElementById("sync");if(e)e.textContent=m}
function save(){
  if(!sb||!me)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const {error}=await sb.from("progress").upsert({user_id:me.id,state:state,updated_at:new Date().toISOString()});
    setSync(error?"ذخیره انجام نشد: "+error.message:"");
  },700);
}
async function logAttempt(sc,i){
  if(!sb||!me)return;
  const c=sc.options[i].consequence;
  const {error}=await sb.from("attempts").upsert({user_id:me.id,scenario_id:sc.id,spine:sc.spine,track:state.track,option_index:i,is_best:i===bestIdx(sc),welfare:c.welfare,trust:c.trust,risk:c.risk},{onConflict:"user_id,scenario_id"});
  if(error)setSync("ثبت پاسخ انجام نشد: "+error.message);
}
async function loadProgress(){
  const {data}=await sb.from("progress").select("state").eq("user_id",me.id).maybeSingle();
  if(data&&data.state&&data.state.done){state=Object.assign(state,data.state)}
}
function showAuth(msg){document.getElementById("auth").hidden=false;if(msg)document.getElementById("authMsg").textContent=msg}
async function enter(session){
  me=session.user;
  document.getElementById("auth").hidden=true;
  document.getElementById("who").textContent=(me.user_metadata&&me.user_metadata.display_name)||me.email;
  document.getElementById("logout").hidden=false;
  await loadProgress();render();setSync("");
}
(function initAuth(){
  if(!sb){showAuth("");document.getElementById("authForm").hidden=true;return}
  let mode="up";
  const setMode=m=>{mode=m;document.getElementById("nameRow").hidden=m==="in";const t=m==="in"?"ورود":"ساخت حساب";document.getElementById("authGo").textContent=t;document.getElementById("authTitle").textContent=t;document.getElementById("pw").autocomplete=m==="in"?"current-password":"new-password";document.getElementById("modeIn").setAttribute("aria-selected",m==="in");document.getElementById("modeUp").setAttribute("aria-selected",m==="up")};
  document.getElementById("modeIn").onclick=()=>setMode("in");document.getElementById("modeUp").onclick=()=>setMode("up");setMode("up");
  document.getElementById("authForm").onsubmit=async e=>{
    e.preventDefault();
    const email=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value,name=(document.getElementById("fn").value+" "+document.getElementById("ln").value).trim();
    const msg=document.getElementById("authMsg");msg.textContent="لطفاً صبر کنید...";
    if(mode==="in"){
      const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
      if(error){msg.textContent="ورود انجام نشد: "+error.message;return}
      await enter(data.session);
    }else{
      if(pw.length<8){msg.textContent="رمز عبور باید حداقل ۸ کاراکتر باشد.";return}
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{display_name:name||email.split("@")[0],track:state.track}}});
      if(error){msg.textContent="ساخت حساب انجام نشد: "+error.message;return}
      if(data.session)await enter(data.session);else msg.textContent="حساب ساخته شد. ایمیل تأیید را باز کنید و بعد وارد شوید.";
    }
  };
  document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();me=null;state={track:state.track,axis:"S1",idx:0,m:{welfare:5,trust:5,risk:3},done:{},evt:{},dossier:Array(9).fill("")};document.getElementById("logout").hidden=true;document.getElementById("who").textContent="";render();showAuth("")};
  sb.auth.getSession().then(({data})=>{if(data.session)enter(data.session);else showAuth("")});
})();
const $=id=>document.getElementById(id);
const clamp=v=>Math.max(0,Math.min(10,v));
const score=o=>o.consequence.welfare+o.consequence.trust-o.consequence.risk;
function bestIdx(sc){let b=0;sc.options.forEach((o,i)=>{if(score(o)>score(sc.options[b]))b=i});return b}
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
function listFor(axis){
  const l=PACK.scenarios.filter(s=>s.spine===axis);
  return l.sort((a,b)=>(a.track===state.track?0:1)-(b.track===state.track?0:1));
}
function renderMeters(){
  $("meters").innerHTML=METER_ORDER.map(([k,t,c])=>`<div class="meter"><div class="row"><span><i class="dot" style="background:${c}"></i>${t}</span><b>${fa(state.m[k])}</b></div><div class="bar"><i style="width:${state.m[k]*10}%;background:${c}"></i></div></div>`).join("");
}
function axisPct(id){
  const l=PACK.scenarios.filter(s=>s.spine===id&&state.done[s.id]!==undefined);
  if(!l.length)return null;
  return Math.round(100*l.filter(s=>state.done[s.id]===bestIdx(s)).length/l.length);
}
function renderRadar(){
  const n=PACK.spine.length,R=80,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[r*Math.cos(a),r*Math.sin(a)]};
  let g="";
  [0.25,0.5,0.75,1].forEach(f=>{g+=`<polygon points="${PACK.spine.map((_,i)=>pt(i,R*f).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`});
  PACK.spine.forEach((s,i)=>{const [x,y]=pt(i,R);g+=`<line x1="0" y1="0" x2="${x}" y2="${y}" stroke="var(--line)"/>`;const [lx,ly]=pt(i,R+16);g+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${SHORT[s.id]}</text>`});
  const pts=PACK.spine.map((s,i)=>{const p=axisPct(s.id);return pt(i,R*(p===null?0:Math.max(p,4)/100)).join(",")});
  g+=`<polygon points="${pts.join(" ")}" fill="var(--accent)" fill-opacity=".25" stroke="var(--accent)" stroke-width="2"/>`;
  PACK.spine.forEach((s,i)=>{const p=axisPct(s.id);if(p!==null){const [x,y]=pt(i,R*Math.max(p,4)/100);g+=`<circle cx="${x}" cy="${y}" r="3.5" fill="var(--accent)"/>`}});
  $("radar").innerHTML=g;
}
function renderAxes(){
  $("axes").innerHTML=PACK.spine.map((s,si)=>{
    const l=PACK.scenarios.filter(x=>x.spine===s.id),d=l.filter(x=>state.done[x.id]!==undefined).length;
    return `<li><button data-a="${s.id}" ${s.id===state.axis?'aria-current="true"':''}><span class="al"><i class="dot" style="background:${PAL[si]}"></i>${s.name.split(" (")[0]}</span><small>${l.length?fa(d)+"/"+fa(l.length):"بدون سناریو"}</small></button></li>`}).join("");
  document.querySelectorAll("#axes button").forEach(b=>b.onclick=()=>{state.axis=b.dataset.a;state.idx=0;showTab("play");render()});
}
function dl(c){return [["welfare","رفاه"],["trust","اعتماد"],["risk","ریسک"]].map(([k,t])=>{const v=c[k];const good=k==="risk"?v<0:v>0;const cls=v===0?"":good?"pos":"neg";return `<span class="${cls}">${t} ${v>0?"+":""}${fa(v)}</span>`}).join("")}
function renderPlay(){
  const ax=PACK.spine.find(s=>s.id===state.axis),l=listFor(state.axis);
  if(!l.length){$("play").innerHTML=`<h2>${ax.name}</h2><p>برای این محور هنوز سناریو نوشته نشده. منبع: ${ax.source}.</p>`;return}
  state.idx=Math.min(state.idx,l.length-1);
  const sc=l[state.idx],chosen=state.done[sc.id],b=bestIdx(sc);
  let h=`<div><span class="chip">${ax.name.split(" (")[0]}</span><span class="chip t">${sc.track==="student"?"مسیر دانشجو":"مسیر درمانگر"}</span><span class="src">${fa(state.idx+1)} از ${fa(l.length)}</span></div>
  <p class="brief">${sc.brief}</p>`;
  sc.options.forEach((o,i)=>{
    const cls=chosen===undefined?"":(i===chosen?"picked ":"")+(i===b?"best":"");
    h+=`<button class="opt ${cls}" data-i="${i}" ${chosen!==undefined?"disabled":""}><span class="ltr">${LET[i]}</span><span class="otxt">${o.text}${chosen!==undefined?`<div class="delta">${dl(o.consequence)}${i===b?'<span class="pos">نزدیک‌ترین به نظر مرجع</span>':""}</div>`:""}</span></button>`});
  if(chosen!==undefined){
    h+=`<div class="ref"><b>نظر مرجع کتاب</b><br>${sc.expert_ref}</div>`;
    if(state.evt[sc.id])h+=`<div class="evt"><b>رویداد</b><br>${sc.events[0]}</div>`;
    h+=`<div class="actions">${sc.events.length&&!state.evt[sc.id]?'<button class="btn ghost" id="evt">اجرای رویداد</button>':""}<button class="btn" id="next">سناریوی بعدی</button></div>`;
  }
  h+=`<p class="src">منبع: ${sc.source}</p>`;
  $("play").innerHTML=h;
  document.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i;if(state.done[sc.id]!==undefined)return;
    state.done[sc.id]=i;logAttempt(sc,i);const c=sc.options[i].consequence;
    for(const k in state.m)state.m[k]=clamp(state.m[k]+c[k]);
    save();render()});
  const ev=$("evt");if(ev)ev.onclick=()=>{state.evt[sc.id]=true;
    for(const k in state.m)state.m[k]=clamp(state.m[k]+(k==="risk"?1:0));save();render()};
  const nx=$("next");if(nx)nx.onclick=()=>{
    if(state.idx<l.length-1)state.idx++;else{const i=PACK.spine.findIndex(s=>s.id===state.axis);const nxt=PACK.spine.slice(i+1).find(s=>PACK.scenarios.some(x=>x.spine===s.id))||PACK.spine.find(s=>PACK.scenarios.some(x=>x.spine===s.id));state.axis=nxt.id;state.idx=0}
    render()};
}
function showTab(){}
["student","therapist"].forEach(t=>$("t-"+t).onclick=()=>{state.track=t;state.idx=0;save();render()});
function render(){
  ["student","therapist"].forEach(t=>$("t-"+t).setAttribute("aria-pressed",state.track===t));
  renderMeters();renderRadar();renderAxes();renderPlay();save();
}
render();
</script>
</body>
